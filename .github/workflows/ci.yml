name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential clang cmake ninja-build pkg-config shellcheck \
            libsodium-dev libwayland-dev libavcodec-dev libavutil-dev libswscale-dev \
            libdrm-dev libva-dev
      - name: Check shell scripts
        run: shellcheck build-site.sh install.sh site/index.html kernel/install.sh kernel/tests/run-vm.sh tests/run-input-vm.sh
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build both binaries and tests
        run: cmake --build build --parallel 2
      - name: Run tests
        run: ctest --test-dir build --output-on-failure --parallel 2
      - name: Check binary startup
        run: |
          build/netdisplay-server --version
          build/netdisplay-client --version
      - name: Package website and check source fallbacks
        if: matrix.compiler == 'gcc'
        run: |
          ./build-site.sh
          mkdir -p "$RUNNER_TEMP/netdisplay-source"
          tar -xzf dist/source.tar.gz -C "$RUNNER_TEMP/netdisplay-source"
          for mode in client server; do
            server=OFF
            client=OFF
            if [ "$mode" = server ]; then server=ON; else client=ON; fi
            cmake -S "$RUNNER_TEMP/netdisplay-source" -B "build/fallback-$mode" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
              -DNETDISPLAY_BUILD_SERVER="$server" -DNETDISPLAY_BUILD_CLIENT="$client"
            cmake --build "build/fallback-$mode" --parallel 2
            "build/fallback-$mode/netdisplay-$mode" --version
          done

  sanitizers:
    name: Address and undefined-behavior sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential cmake ninja-build pkg-config libsodium-dev
      - name: Configure hardware-independent tests
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON \
            -DNETDISPLAY_BUILD_SERVER=OFF -DNETDISPLAY_BUILD_CLIENT=OFF \
            '-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer'
      - name: Build
        run: cmake --build build --parallel 2
      - name: Run tests under sanitizers
        run: ctest --test-dir build --output-on-failure --parallel 2

  kernel:
    name: DKMS, native power and receiver input VM tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install kernel build and VM dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential dkms linux-image-generic linux-headers-generic \
            qemu-system-x86 cpio gzip zstd xz-utils kmod upower dbus
      - name: Build with DKMS and test in a disposable guest
        run: |
          image=$(sudo find /boot -maxdepth 1 -name 'vmlinuz-*-generic' | sort -V | tail -n 1)
          release=${image##*/}
          release=${release#vmlinuz-}
          sudo install -d /usr/src/netdisplay-power-0.1.0
          sudo install -m 0644 kernel/netdisplay_power.c kernel/netdisplay_power.h \
            kernel/Makefile kernel/dkms.conf /usr/src/netdisplay-power-0.1.0/
          sudo dkms add -m netdisplay-power -v 0.1.0
          if ! sudo dkms build -m netdisplay-power -v 0.1.0 -k "$release"; then
            sudo cat /var/lib/dkms/netdisplay-power/0.1.0/build/make.log
            exit 1
          fi
          sudo cp "$image" "$RUNNER_TEMP/netdisplay-test-kernel"
          sudo chmod a+r "$RUNNER_TEMP/netdisplay-test-kernel"
          KERNEL_RELEASE="$release" KERNEL_IMAGE="$RUNNER_TEMP/netdisplay-test-kernel" \
            ./kernel/tests/run-vm.sh
          KERNEL_RELEASE="$release" KERNEL_IMAGE="$RUNNER_TEMP/netdisplay-test-kernel" \
            ./tests/run-input-vm.sh
